theme = "custom"               # any built-in theme id, auto, or custom
mode = "auto"                  # auto, split, stack
vcs = "git"                    # git, jj, sl
watch = true
exclude_untracked = false
line_numbers = true
wrap_lines = false
menu_bar = true
agent_notes = false
transparent_background = false

[custom_theme]
base = "light-plus"
label = "Neovim Light"
background = "#ffffff"
panel = "#f3f8ff"
panelAlt = "#e7f0ff"
border = "#9fc7ff"
accent = "#0086a8"
accentMuted = "#cfe8ff"
text = "#080808"
muted = "#808080"
addedBg = "#e1f5e8"
removedBg = "#ffe5e9"
movedAddedBg = "#e4f0ff"
movedRemovedBg = "#fff2c6"
contextBg = "#ffffff"
addedContentBg = "#cef0db"
removedContentBg = "#ffd4dc"
contextContentBg = "#ffffff"
addedSignColor = "#22863a"
removedSignColor = "#cf222e"
lineNumberBg = "#f3f8ff"
lineNumberFg = "#808080"
selectedHunk = "#cfe8ff"
badgeAdded = "#22863a"
badgeRemoved = "#cf222e"
badgeNeutral = "#0086a8"
noteBorder = "#0086a8"
noteBackground = "#f3f8ff"
noteTitleBackground = "#e7f0ff"
noteTitleText = "#080808"
fileNew = "#22863a"
fileDeleted = "#cf222e"
fileModified = "#0086a8"
fileRenamed = "#871094"
fileUntracked = "#808000"

[custom_theme.syntax]
default = "#080808"
keyword = "#080808"
string = "#008000"
comment = "#808080"
number = "#0000ff"
function = "#00627a"
property = "#871094"
type = "#000080"
variable = "#080808"
operator = "#080808"
punctuation = "#080808"
