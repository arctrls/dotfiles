theme = "custom"               # any built-in theme id, auto, or custom
mode = "auto"                  # auto, split, stack
vcs = "git"                    # git, jj, sl
watch = true
exclude_untracked = false
line_numbers = true
wrap_lines = false
menu_bar = true
agent_notes = false
transparent_background = false

[custom_theme]
base = "light-plus"
label = "Codex Light"
background = "#ffffff"
panel = "#ffffff"
panelAlt = "#f7f7f7"
border = "#d0d0d0"
accent = "#0086a8"
accentMuted = "#e6f4ff"
text = "#080808"
muted = "#808080"
addedBg = "#dbf9de"
removedBg = "#fbe9e6"
movedAddedBg = "#e4f0ff"
movedRemovedBg = "#fff2c6"
contextBg = "#ffffff"
addedContentBg = "#dbf9de"
removedContentBg = "#fbe9e6"
contextContentBg = "#ffffff"
addedSignColor = "#22863a"
removedSignColor = "#cf222e"
lineNumberBg = "#ffffff"
lineNumberFg = "#808080"
selectedHunk = "#cfe8ff"
badgeAdded = "#22863a"
badgeRemoved = "#cf222e"
badgeNeutral = "#0086a8"
noteBorder = "#0086a8"
noteBackground = "#ffffff"
noteTitleBackground = "#f7f7f7"
noteTitleText = "#080808"
fileNew = "#22863a"
fileDeleted = "#cf222e"
fileModified = "#0086a8"
fileRenamed = "#871094"
fileUntracked = "#808000"

[custom_theme.syntax]
default = "#080808"
keyword = "#080808"
string = "#008000"
comment = "#808080"
number = "#0000ff"
function = "#00627a"
property = "#871094"
type = "#000080"
variable = "#080808"
operator = "#080808"
punctuation = "#080808"
