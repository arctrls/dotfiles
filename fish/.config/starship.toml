"$schema" = 'https://starship.rs/config-schema.json'

right_format = '$kubernetes'
palette = 'light'

[aws]
disabled = true

[bun]
style = 'red'

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'
vimcmd_symbol = '[❮](green)'
vimcmd_visual_symbol = '[❮](yellow)'
vimcmd_replace_symbol = '[❮](purple)'
vimcmd_replace_one_symbol = '[❮](purple)'

[cmd_duration]
style = 'yellow'

[directory]
style = 'cyan'

[docker_context]
style = 'blue'

[gcloud]
disabled = true

[git_branch]
style = 'purple'

[git_commit]
style = 'green'

[git_state]
style = 'yellow'

[git_status]
style = 'red'

[gradle]
style = 'bright-cyan'

[jobs]
style = 'blue'

[kotlin]
style = 'blue'

[kubernetes]
disabled = false
format = '[$context( / $namespace)]($style)'
style = 'purple'

[maven]
style = 'bright-cyan'

[nodejs]
style = 'green'
not_capable_style = 'red'

[package]
style = '208'

[python]
style = 'yellow'

[palettes.light]
black = '#24292e'
red = '#b31d28'
green = '#22863a'
yellow = '#9a6700'
blue = '#005cc5'
purple = '#6f42c1'
cyan = '#006d77'
white = '#24292e'
bright-black = '#57606a'
